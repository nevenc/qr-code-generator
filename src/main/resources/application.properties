spring.application.name=qr-code-generator

logging.level.com.nevenc.qrcodegenerator=TRACE

# Multipart limits for logo upload.
# Our LogoValidator enforces 1 MB; Spring's limit must be higher so
# validation errors surface as our typed exception, not Spring's.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
